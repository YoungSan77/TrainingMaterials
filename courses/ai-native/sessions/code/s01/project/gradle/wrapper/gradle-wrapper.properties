#
# 과정이 고정한 Gradle 버전이다. setup.sh가 `gradle wrapper --gradle-version 9.9.2`로
# gradlew와 gradle-wrapper.jar를 이 설정에 맞춰 생성한다 — 그 두 파일은 생성물이므로
# 저장소에 두지 않는다.
#
# distributionSha256Sum은 적지 않는다. 배포본의 무결성은 setup.sh가 공식 배포처의
# .sha256 파일 또는 오프라인 배포 폴더의 짝 파일로 확인한다.
#
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.9.2-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
